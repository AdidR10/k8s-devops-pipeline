name: build-and-deploy
on:
  push:
    branches: [my-lab-4]
    paths-ignore:
      - 'charts/**'          # the bot's tag-bump commit must not re-trigger this

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, products-api, orders-api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}

  bump-tag:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to push the tag-bump commit
    steps:
      - uses: actions/checkout@v4
      - name: Bump imageTag in values.yaml
        run: |
          sed -i "s|^  imageTag:.*|  imageTag: ${{ github.sha }}|" charts/shop/values.yaml
          git config user.name  "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git commit -am "ci: bump imageTag to ${{ github.sha }} [skip ci]"
          git push