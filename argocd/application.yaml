apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/<your-username>/k8s-devops-pipeline.git
    targetRevision: my-lab-4
    path: charts/shop
  destination:
    server: https://kubernetes.default.svc
    namespace: shop
  syncPolicy:  
    syncOptions:
      - CreateNamespace=true