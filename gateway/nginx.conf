events {}

http {
  # IMPORTANT: force nginx to re-resolve backend hostnames at runtime.
  #
  # Stock nginx resolves proxy_pass hostnames ONCE at startup and caches the IP
  # forever. In a cluster where Service IPs change (pod restarts, rollbacks,
  # redeploys) that cached IP goes stale and every request 502s while kubectl
  # looks healthy. Using a `resolver` plus a variable in `proxy_pass` makes
  # nginx look the name up again on each request.
  #
  # 127.0.0.11 is Docker's embedded DNS (used by docker-compose).
  # In Kubernetes (Lab 2) this line becomes the CoreDNS ClusterIP: 10.43.0.10.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;

    # Frontend UI at the root.
    location / {
      set $frontend http://frontend:3000;
      proxy_pass $frontend;
    }

    # Backend APIs. Each proxy_pass includes the target path, so /api/products
    # is served by products-api's /products endpoint (same for orders).
    location = /api/products {
      set $products http://products-api:8080/products;
      proxy_pass $products;
    }

    location = /api/orders {
      set $orders http://orders-api:8080/orders;
      proxy_pass $orders;
    }
  }
}
