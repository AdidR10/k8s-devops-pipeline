apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-api
spec:
  replicas: {{ .Values.productsApi.replicas }}
  selector:
    matchLabels:
      app: products-api
  template:
    metadata:
      labels:
        app: products-api
    spec:
      containers:
      - name: products-api
        image: {{ .Values.global.imageRepo }}/products-api:{{ .Values.global.imageTag }}
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secret
        env:
        - name: DB_HOST
          value: products-db
        - name: DB_NAME
          value: products
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: products-api
  labels:
    app: products-api      # so the ServiceMonitor's selector can find this Service
spec:
  selector:
    app: products-api
  ports:
  - name: http             # so the ServiceMonitor can reference the port by name
    port: 8080
    targetPort: 8080
