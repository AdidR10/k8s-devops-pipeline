apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
spec:
  replicas: {{ .Values.ordersApi.replicas }}
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
      - name: orders-api
        image: {{ .Values.global.imageRepo }}/orders-api:{{ .Values.global.imageTag }}
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secret
        env:
        - name: DB_HOST
          value: orders-db
        - name: DB_NAME
          value: orders
        - name: PRODUCTS_API_URL
          value: http://products-api:8080
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
spec:
  selector:
    app: orders-api
  ports:
  - port: 8080
    targetPort: 8080
