apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
data:
  nginx.conf: |
    events {}
    http {
      # k3s CoreDNS, so nginx re-resolves Service names at runtime instead of
      # caching a stale IP after a Pod restart.
      resolver 10.43.0.10 valid=10s ipv6=off;
      server {
        listen 80;
        location / {
          set $frontend http://frontend.{{ .Release.Namespace }}.svc.cluster.local:3000;
          proxy_pass $frontend;
        }
        location = /api/products {
          set $products http://products-api.{{ .Release.Namespace }}.svc.cluster.local:8080/products;
          proxy_pass $products;
        }
        location = /api/orders {
          set $orders http://orders-api.{{ .Release.Namespace }}.svc.cluster.local:8080/orders;
          proxy_pass $orders;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: config
        configMap:
          name: gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
  - port: 80
    targetPort: 80
    nodePort: {{ .Values.gateway.nodePort }}
