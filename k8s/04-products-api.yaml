apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-api
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: products-api
  template:
    metadata:
      labels:
        app: products-api
    spec:
      containers:
      - name: products-api
        image: adidr10/products-api:v1
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secret
        env:
        - name: DB_HOST
          value: products-db
        - name: DB_NAME
          value: products
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: products-api
  namespace: shop
spec:
  selector:
    app: products-api
  ports:
  - port: 8080
    targetPort: 8080
